# 构建并发布 foresight-agent 平台二进制包到 npm。
# 用法：手动触发 workflow_dispatch（或推 tag v* 自动跑），
# 三个平台并行构建，产物各自 publish 为 foresight-agent-<platform>-<arch>。
# 发布后需手动 `npm publish` 主包 foresight-agent（版本与子包一致）。
name: publish-npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（必须与 packaging/npm/foresight-agent/package.json 一致）"
        required: true
        default: "0.4.0"
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg: win32-x64
            npm_os: win32
            npm_cpu: x64
          - os: macos-15-intel
            pkg: darwin-x64
            npm_os: darwin
            npm_cpu: x64
          - os: macos-latest
            pkg: darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - os: ubuntu-latest
            pkg: linux-x64
            npm_os: linux
            npm_cpu: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Build binary (PyInstaller)
        run: uv run --with pyinstaller pyinstaller --onefile --name foresight --paths src --collect-all duckdb --collect-all pydantic_core --hidden-import dotenv packaging/entry.py

      # Linux 上 arm64 需交叉编译，单独 job：
      # - name: Build arm64 (aarch64-unknown-linux-gnu)
      #   if: ...
      #   run: uv pip install --target ... aarch64 python musl 交叉链（如 pyinstaller 官方 aarch64 预编译 bootloader）

      - name: Stage npm package
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && V="${{ github.event.inputs.version }}"
          MAIN_VERSION=$(node -p "require('./packaging/npm/foresight-agent/package.json').version")
          if [ "$V" != "$MAIN_VERSION" ]; then
            echo "版本不一致：输入/标签=$V，主包=$MAIN_VERSION" >&2
            exit 1
          fi
          EXT=${{ runner.os == 'Windows' && '".exe"' || '""' }}
          mkdir -p pkg/bin
          cp dist/foresight* pkg/bin/foresight${EXT}
          # 逐平台写 os/cpu：旧实现只 sed 版本/包名/路径，四个平台包都带 win32/x64 元数据，
          # npm 会在 macOS/Linux 上直接判定不兼容而不安装（README 的多平台承诺落空）。
          node -e '
            const fs = require("fs");
            const [src, out, name, version, os, cpu] = process.argv.slice(1);
            const p = JSON.parse(fs.readFileSync(src, "utf8"));
            p.name = name;
            p.version = version;
            p.os = [os];
            p.cpu = [cpu];
            p.description = `Foresight engine binary (${os}-${cpu}; do not install directly).`;
            delete p.bin;  // 平台包只提供二进制；裸 foresight 命令归 agent shell
            fs.writeFileSync(out, JSON.stringify(p, null, 2) + "\n");
          ' packaging/npm/foresight-agent-win32-x64/package.json pkg/package.json \
            "foresight-agent-${{ matrix.pkg }}" "$V" "${{ matrix.npm_os }}" "${{ matrix.npm_cpu }}" "$EXT"

      - name: Configure npm auth
        shell: bash
        run: |
          npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: npm publish pkg/

  publish-main:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Configure npm auth
        shell: bash
        run: |
          npm config set //registry.npmjs.org/:_authToken $NODE_AUTH_TOKEN
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish packaging/npm/foresight-agent/
