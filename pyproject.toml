[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictor"]

[project]
name = "predictor"
version = "0.3.0"
description = "Foresight prediction agent engine (Halawi pipeline + Brier track record)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx",
    "duckdb",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
foresight = "predictor.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
