<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a0d14">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Foresight 预测展示</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9.5' fill='%230a0d14'/%3E%3Ccircle cx='12' cy='12' r='7.2' fill='none' stroke='%236ea0ff' stroke-width='1.4'/%3E%3Cpath d='M12 1.6 V4.8 M12 19.2 V22.4 M1.6 12 H4.8 M19.2 12 H22.4' stroke='%236ea0ff' stroke-width='1.4' stroke-linecap='round'/%3E%3Cpath d='M15.4 8.6 L19.2 4.8' stroke='%236ea0ff' stroke-width='1.4' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%236ea0ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 1.4 V4.6 M12 19.4 V22.6 M1.4 12 H4.6 M19.4 12 H22.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M15.3 8.7 L19.2 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2.1" fill="currentColor"/>
      </svg>
      <h1>Foresight <span class="tag">预测引擎</span></h1>
    </div>
    <nav id="tabs" role="tablist">
      <button class="tab active" data-tab="board" role="tab" aria-selected="true">看板</button>
      <button class="tab" data-tab="system" role="tab" aria-selected="false">系统</button>
      <button class="tab" data-tab="ops" role="tab" aria-selected="false">系统日志</button>
    </nav>
    <div id="mode-switch"></div>
  </header>
  <div id="error-banner" hidden></div>
  <main id="app"></main>

  <div id="detail-overlay" hidden>
    <div id="detail-panel" role="dialog" aria-modal="true" aria-label="题目详情">
      <button id="detail-close" title="关闭" aria-label="关闭">×</button>
      <div id="detail-body"></div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
